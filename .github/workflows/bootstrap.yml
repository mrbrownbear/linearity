name: Bootstrap local static capture

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/bootstrap.yml"
      - ".bootstrap/build.py"

permissions:
  contents: write

concurrency:
  group: linearity-bootstrap
  cancel-in-progress: true

jobs:
  localize:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Build local static capture
        run: python .bootstrap/build.py
