name: Repair and verify local animations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/repair-local-animations.yml"
      - ".github/scripts/repair-local-animations.py"
      - ".github/scripts/test-local-animations.py"

permissions:
  contents: write

concurrency:
  group: linearity-animation-repair
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Restore bootstrap
        run: python .github/scripts/repair-local-animations.py

      - name: Install browser
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install chromium

      - name: Verify locally
        run: |
          python -m http.server 8123 --bind 127.0.0.1 >/tmp/linearity-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 2
          python .github/scripts/test-local-animations.py

      - name: Commit verified static site
        run: |
          rm -rf .github
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore verified local animations"
          git push origin HEAD:main
