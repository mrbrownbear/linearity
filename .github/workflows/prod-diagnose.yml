name: Diagnose production animations

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/prod-diagnose.yml"
      - ".github/scripts/prod-diagnose.py"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install browser
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install chromium
      - name: Test Vercel production
        run: python .github/scripts/prod-diagnose.py
