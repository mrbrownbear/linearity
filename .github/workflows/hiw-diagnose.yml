name: Diagnose how-it-works Lottie

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/hiw-diagnose.yml"
      - ".github/scripts/hiw-diagnose.py"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Chromium
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install chromium
      - name: Test local and production
        run: |
          python -m http.server 8123 --bind 127.0.0.1 >/tmp/http.log 2>&1 &
          PID=$!
          trap 'kill $PID || true' EXIT
          sleep 2
          python .github/scripts/hiw-diagnose.py
